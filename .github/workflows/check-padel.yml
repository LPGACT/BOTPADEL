name: Chequeo Padel

on:
  schedule:
    - cron: '*/5 * * * *'  # cada 5 minutos
  workflow_dispatch:        # permite correrlo manualmente desde GitHub

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ATC_EMAIL

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci --ignore-scripts

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Instalar Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Crear directorios necesarios
        run: mkdir -p data screenshots

      - name: Restaurar sesión ATC (bootstrap desde secret)
        run: |
          if [ -n "$SESSION_JSON_B64" ]; then
            echo "$SESSION_JSON_B64" | base64 -d > data/session.json
            echo "Sesión cargada desde secret."
          fi
        env:
          SESSION_JSON_B64: ${{ secrets.SESSION_JSON_B64 }}

      - name: Restaurar sesión ATC (cache de runs anteriores)
        uses: actions/cache/restore@v4
        with:
          path: data/session.json
          key: atc-session-${{ github.run_id }}
          restore-keys: |
            atc-session-

      - name: Ejecutar chequeo
        run: node src/run-once.js
        env:
          ATC_EMAIL: ${{ secrets.ATC_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          VENUE_URL: 'https://atcsports.io/venues/kuman-caba'
          SPORT_ID: '17'
          DURATION_MINUTES: '90'
          TARGET_TIMES: '18:00,18:30,19:00,19:30'
          HEADLESS: 'true'
          STOP_AFTER_BOOKING: 'true'

      - name: Guardar sesión ATC actualizada
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/session.json
          key: atc-session-${{ github.run_id }}
