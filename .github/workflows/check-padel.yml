name: Chequeo Padel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci --ignore-scripts

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Instalar Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Crear directorios necesarios
        run: mkdir -p data screenshots logs

      - name: Construir .env desde secrets
        env:
          V1: ${{ secrets.ATC_EMAIL }}
          V2: ${{ secrets.GMAIL_APP_PASSWORD }}
          V3: ${{ secrets.SMTP_USER }}
          V4: ${{ secrets.SMTP_PASS }}
          V5: ${{ secrets.NOTIFY_EMAIL }}
          V6: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          V7: ${{ secrets.TELEGRAM_CHAT_ID }}
          V8: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          printf 'ATC_EMAIL=%s\nGMAIL_APP_PASSWORD=%s\nSMTP_USER=%s\nSMTP_PASS=%s\nNOTIFY_EMAIL=%s\nTELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\nTELEGRAM_GROUP_ID=%s\nVENUE_URL=https://atcsports.io/venues/kuman-caba\nVENUE_PLACE_ID=\nSPORT_ID=17\nDURATION_MINUTES=90\nTARGET_TIMES=18:00,18:30,19:00,19:30\nHEADLESS=true\nSTOP_AFTER_BOOKING=true\n' \
            "$V1" "$V2" "$V3" "$V4" "$V5" "$V6" "$V7" "$V8" > .env

      - name: Restaurar sesión ATC (del run anterior)
        uses: actions/cache/restore@v4
        with:
          path: data/session.json
          key: atc-session-${{ github.run_id }}
          restore-keys: |
            atc-session-

      - name: Ejecutar chequeo
        run: node src/run-once.js

      - name: Guardar sesión ATC actualizada
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/session.json
          key: atc-session-${{ github.run_id }}
